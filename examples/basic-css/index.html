<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser2IDE CSS example</title>
    <link
      rel="stylesheet"
      href="__VENDOR_CSS_URL__"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./dist/app.css" />
    <link rel="stylesheet" href="./fallback.css" />
    <link rel="stylesheet" href="./virtual.css" />
  </head>
  <body>
    <main class="layout">
      <article id="fixture-card" class="card featured">
        <h1>Browser2IDE fixture</h1>
        <p>Inspect this card.</p>
        <p>
          Normal card clicks:
          <output id="normal-click-count" aria-live="polite">0</output>
        </p>
      </article>
    </main>
    <script>
      const fixtureCard = document.getElementById("fixture-card");
      const clickCount = document.getElementById("normal-click-count");
      let normalClicks = 0;
      fixtureCard.addEventListener("click", () => {
        normalClicks += 1;
        clickCount.value = String(normalClicks);
      });
    </script>
  </body>
</html>
