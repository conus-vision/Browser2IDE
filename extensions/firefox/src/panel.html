<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser2IDE</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <header class="panel-header">
      <div class="brand">
        <img src="./browser2ide.svg" alt="" width="20" height="20" />
        <h1>Browser2IDE</h1>
      </div>
      <output id="connection-status" class="status" data-state="not-linked">
        Not linked
      </output>
    </header>

    <main>
      <section class="connection" aria-label="Bridge link">
        <form id="link-form" class="link-controls">
          <label class="field">
            <span>Link code</span>
            <input
              id="link-code"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              maxlength="9"
              spellcheck="false"
            />
          </label>
          <div class="commands">
            <button id="link-button" type="submit" disabled>Link</button>
            <button id="unlink-button" type="button" disabled>Unlink</button>
          </div>
        </form>
      </section>

      <section class="inspect-toolbar" aria-label="Inspect mode">
        <label class="toggle">
          <input id="inspect-mode" type="checkbox" disabled />
          <span>Inspect mode</span>
        </label>
      </section>

      <section class="selection" aria-labelledby="selection-title">
        <h2 id="selection-title">Last selected element</h2>
        <output id="selected-summary">None</output>
      </section>

      <section class="diagnostics" aria-labelledby="diagnostics-title">
        <h2 id="diagnostics-title">Diagnostics</h2>
        <dl>
          <dt>Link</dt>
          <dd><output id="link-status">Not linked</output></dd>
          <dt data-link-detail hidden>Endpoint</dt>
          <dd data-link-detail hidden>
            <output id="linked-endpoint">None</output>
          </dd>
          <dt data-link-detail hidden>Session</dt>
          <dd data-link-detail hidden>
            <output id="linked-session">None</output>
          </dd>
          <dt data-link-detail hidden>Bridge instance</dt>
          <dd data-link-detail hidden>
            <output id="bridge-instance">None</output>
          </dd>
          <dt>Last message</dt>
          <dd><output id="last-message">None</output></dd>
          <dt>Matched CSS facts</dt>
          <dd><output id="matched-facts">0</output></dd>
          <dt>Inaccessible stylesheets</dt>
          <dd><output id="inaccessible-stylesheets">0</output></dd>
          <dt>Last error</dt>
          <dd><output id="last-error">None</output></dd>
        </dl>
      </section>
    </main>

    <script src="./panel.js"></script>
  </body>
</html>
