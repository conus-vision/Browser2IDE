name: Release draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify annotated tag and product versions
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          RELEASE_VERSION="$(node tools/verify-release-version.mjs "$RELEASE_TAG")"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: corepack pnpm build

      - name: Run unit and release tests
        run: corepack pnpm test

      - name: Run VS Code Extension Host integration tests
        run: xvfb-run -a corepack pnpm test:integration

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Lint Firefox extension
        run: corepack pnpm exec web-ext lint --source-dir extensions/firefox --ignore-files package.json pnpm-lock.yaml tsconfig.json esbuild.mjs "src/**" "test/**"

      - name: Test Chrome manifest and adapter
        run: corepack pnpm --filter browser2ide-chrome test -- manifest.test.ts adapter.test.ts

      - name: Package unsigned artifacts
        run: corepack pnpm package

      - name: Check generated drift
        run: |
          git diff --check
          git diff --exit-code

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "artifacts/browser2ide-vscode-${RELEASE_VERSION}.vsix" \
            "artifacts/browser2ide-chrome-${RELEASE_VERSION}.zip" \
            "artifacts/browser2ide-firefox-${RELEASE_VERSION}.zip" \
            "artifacts/browser2ide-firefox-source-${RELEASE_VERSION}.zip" \
            "artifacts/SHA256SUMS" \
            --draft \
            --verify-tag \
            --title "Browser2IDE $RELEASE_TAG" \
            --generate-notes
